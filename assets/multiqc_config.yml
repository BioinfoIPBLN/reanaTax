report_comment: >
  This report has been generated by the <a href="https://github.com/BioinfoIPBLN/reanatax/tree/dev" target="_blank">BioinfoIPBLN/reanatax</a>
  analysis pipeline.
report_section_order:
  # The AI narrative of the taxonomic profile is the one thing worth reading
  # first, so it sits above everything including the methods description.
  "reanatax-ai-insight":
    order: 1000
  "BioinfoIPBLN-reanatax-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "BioinfoIPBLN-reanatax-summary":
    order: -1002

export_plots: true

disable_version_detection: true

# HISAT2 writes a Bowtie2-style summary, so it is MultiQC's `bowtie2` module
# that parses it - renamed here to avoid claiming an aligner that never ran.
# The order follows the pipeline: raw QC, trimming, host depletion, then
# classification of what was left over.
module_order:
  - fastqc:
      name: "FastQC (raw)"
      info: "Quality of the reads exactly as they arrived, before any trimming."
      path_filters:
        - "*_raw*.zip"
  - fastp
  - fastqc:
      name: "FastQC (trimmed)"
      info: "Quality of the reads after fastp trimming - these are the reads that go into host depletion."
      path_filters:
        - "*_trimmed*.zip"
  - bowtie2:
      name: "HISAT2 (host depletion)"
      info: "Alignment against the host genome. The overall alignment rate is the host fraction of the library; everything that did not align is what gets classified below."
  - samtools
  - qualimap:
      name: "Qualimap (host BAM)"
      info: "Coverage, duplication and mapping-quality profile of the reads that DID align to the host. Low genome fraction here is expected - it means the library is not dominated by host."
  - kraken

# HISAT2 and samtools outputs are prefixed `<sample>.host`, so strip that to
# keep one row per sample across every section of the general statistics table.
extra_fn_clean_exts:
  - ".host"
  - "_raw"
  - "_trimmed"

# The host alignment rate is the headline number of the depletion step.
table_columns_visible:
  "FastQC (raw)":
    percent_duplicates: false
    percent_gc: true
    avg_sequence_length: true
    total_sequences: true
  "FastQC (trimmed)":
    percent_duplicates: false
    percent_gc: false
    avg_sequence_length: false
    total_sequences: false
  "HISAT2 (host depletion)":
    overall_alignment_rate: true
  Samtools:
    error_rate: false
    non-primary_alignments: false
    reads_mapped: true
    reads_mapped_percent: false
    reads_properly_paired_percent: false
