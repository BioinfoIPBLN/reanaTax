---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# vegan is what the script actually uses; it comes in as a hard dependency of
# phyloseq, whose biocontainer is the maintained one at a current R.
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::bioconductor-phyloseq=1.50.0
