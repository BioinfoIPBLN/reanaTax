---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# PRISM is not packaged: it is an R script that shells out to five aligners and
# classifiers. This is its dependency list from the repository's README, and it
# is the only route that does not need a hand-built image. Under docker or
# singularity, pass --prism_container instead.
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::kraken2=2.1.3
  - bioconda::minimap2=2.28
  - bioconda::star=2.7.11b
  - bioconda::blast=2.16.0
  - bioconda::seqkit=2.8.2
  - conda-forge::r-base=4.3
  - conda-forge::r-optparse
  - conda-forge::r-tidyverse
  - conda-forge::r-furrr
  - conda-forge::r-data.table
  - conda-forge::r-vegan
  # NOT in PRISM's documented dependency list, and required anyway: functions.R
  # calls predict() on the xgb.Booster it readRDS()es without ever attaching
  # xgboost, so predict.xgb.Booster is unregistered and the scoring step dies
  # on a stock install.
  #
  # Pinned to 1.7 deliberately. prismxg.RDS was written with saveRDS on an
  # xgb.Booster - which xgboost warns against, because the model's `handle` is
  # an external pointer - and its fields (handle, raw, niter, evaluation_log,
  # params, callbacks) are the 1.x layout. The 2.x/3.x R interface changed how
  # those are restored, so the newest package is the riskiest choice here.
  - conda-forge::r-xgboost=1.7.6
  - bioconda::bioconductor-shortread
  - conda-forge::python=3.12
